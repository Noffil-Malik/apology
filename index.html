<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cinematic Cloud Transition Scroll</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Merriweather:wght@300;400;700&display=swap');

:root{
  --gold-1:#fff6cf;
  --gold-2:#f4d56a;
  --gold-3:#d4a93c;
  --ink:#5a2b86;
  --rodH:60px;
  --sheetW:min(68vw,850px);
  --sheetH:min(78vh,1080px);
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;font-family:'Merriweather',serif;color:#fff;overflow:hidden;background:#000}
::selection{background:rgba(250,224,168,.6)}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

#intro{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;z-index:10;transition:opacity .8s ease;
  background:
    radial-gradient(1400px 700px at 50% 0%, rgba(255,220,170,.25), rgba(0,0,0,0) 60%),
    linear-gradient(180deg,#24113f 0%, #401a72 40%, #6a0dad 100%);
}
#intro .gate{
  width:min(92vw,520px);
  background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  padding:28px 22px 24px;
  box-shadow:0 10px 60px rgba(0,0,0,.35), 0 0 40px rgba(255,220,150,.15);
}
#intro h1{
  font-family:'Dancing Script',cursive;
  font-size:2.6rem; margin:0 0 6px; color:#fff;
  text-shadow:0 0 16px rgba(255,220,150,.55);
}
#intro p.sub{margin:0 0 18px; color:rgba(255,255,255,.86); font-size:1.02rem;}
.formRow{display:flex;gap:10px;align-items:center;justify-content:center;}
#passInput{
  flex:1;min-width:0;font-size:1.05rem;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.25);color:#fff;outline:none;box-shadow:inset 0 0 0 9999px rgba(255,255,255,.04);
}
#passInput::placeholder{color:rgba(255,255,255,.55)}
#unlockBtn{
  border:0;padding:14px 18px;border-radius:12px;cursor:pointer;white-space:nowrap;
  background:linear-gradient(90deg,var(--gold-1),var(--gold-2));
  color:#4c1f86;font-size:1.02rem;font-weight:600;
  box-shadow:0 0 18px rgba(255,220,150,.45);
  transition:transform .15s ease,filter .2s ease;
}
#unlockBtn:hover{transform:translateY(-1px);filter:brightness(1.05);}
#hint{margin-top:10px;font-size:.95rem;color:#ffdca0;opacity:.9;}
#error{margin-top:10px;font-size:.95rem;color:#ffb3b3;opacity:0;transition:opacity .2s ease;}
.shake{animation:shake .25s linear 1;}
@keyframes shake{
  0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}100%{transform:translateX(0)}
}

/* === VIDEOS === */
#firstVideo,#bgVideo{
  position:fixed;top:50%;left:50%;width:100vw;height:100vh;
  transform:translate(-50%,-50%);
  object-fit:cover;object-position:center;background:#000;
  transition:opacity 2s ease;z-index:1;
}
#firstVideo{z-index:5;opacity:0;transition:opacity 1.5s ease;pointer-events:none;}
#bgVideo{z-index:1;opacity:0;transition:opacity 2s ease;}
#blackout{position:fixed;inset:0;background:#000;z-index:7;opacity:0;transition:opacity 2s ease;pointer-events:none;}

/* === SCROLL === */
#scene{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-start;padding-top:10vh;perspective:1700px;z-index:3;}
#scrollRig{position:relative;width:var(--sheetW);margin:0 auto;height:calc(var(--rodH)*2 + var(--sheetH));transform-style:preserve-3d;}
#scrollTop,#scrollBottom{
  position:absolute;left:50%;
  width:calc(var(--sheetW) + 80px);
  height:calc(var(--rodH) * 0.85);
  border-radius:999px;
  background:
    radial-gradient(60% 130% at 50% -30%, #ffffff 0%, transparent 60%),
    linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 45%,var(--gold-3) 85%,#fff0b6 100%);
  box-shadow:
    0 0 30px 8px rgba(255,220,150,.55),
    inset 0 0 12px rgba(255,255,255,.8);
  transform:translateX(-50%);
  opacity:0;
  z-index:4;
}
#scrollTop{top:0;}
#scrollBottom{transform:translateX(-50%) translateY(0);}
#scrollTop::before,#scrollTop::after,#scrollBottom::before,#scrollBottom::after{
  content:"";position:absolute;top:-2px;width:calc(var(--rodH)*0.9);height:calc(var(--rodH)*0.9 + 4px);
  border-radius:50%;
  background:radial-gradient(circle at 38% 38%, #fff, #f5e0a8 55%, #bd8f36 100%);
  box-shadow:inset 0 0 10px rgba(0,0,0,.25),0 0 14px rgba(255,220,150,.55);
}
#scrollTop::before{left:-20px;}#scrollTop::after{right:-20px;}#scrollBottom::before{left:-20px;}#scrollBottom::after{right:-20px;}
#parchmentWrap{position:absolute;left:50%;top:calc(var(--rodH)-25px);transform:translateX(-50%);width:var(--sheetW);height:var(--sheetH);}
#parchment{
  position:absolute;top:0;left:0;width:100%;height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overflow-x:hidden;
  border-left:22px solid #dcbc6a;border-right:22px solid #dcbc6a;border-radius:22px;
  background:linear-gradient(to bottom,#fffdf6 0%,#fff7e6 45%,#fbe9bf 100%);
  box-shadow:0 0 60px 24px rgba(255,230,170,.85),0 0 80px rgba(255,200,120,.4),inset 0 0 22px rgba(255,255,255,.55);
  color:var(--ink);text-align:left;padding:0 26px;opacity:0;transform-origin:top center;
}
.opened #parchment{height:var(--sheetH);overflow-y:auto;}
#parchment .pad{padding:48px 10px 60px;max-width:min(64ch,92%);margin:0 auto;}
#parchment h2{text-align:center;font-family:'Playfair Display',serif;font-weight:600;font-size:2rem;color:#5a2b86;text-shadow:0 0 10px rgba(255,230,170,.5);opacity:0;}
#parchment p{margin:14px 0;font-family:'Merriweather',serif;font-weight:400;font-size:1.03rem;line-height:1.75;color:#49256f;opacity:0;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#parchment::-webkit-scrollbar{width:8px;}#parchment::-webkit-scrollbar-thumb{background:#c9a84f;border-radius:4px;}
#parchment::-webkit-scrollbar-track{background:rgba(0,0,0,.1);}
.mediaFrame{display:block;margin:28px auto;border:5px solid #dcbc6a;border-radius:16px;
  box-shadow:0 0 25px rgba(255,210,100,.4),0 0 50px rgba(255,240,180,.2);max-width:90%;height:auto;animation:fadeIn 1.2s ease forwards;}
video.mediaFrame{background:#000;object-fit:contain;width:auto;max-width:90%;max-height:80vh;}
img.mediaFrame{width:auto;max-width:90%;height:auto;}
</style>
</head>
<body>

<section id="intro">
  <div class="gate">
    <h1>A Magical Surprise</h1>
    <p class="sub">Enter the secret word to unlock.</p>
    <form id="startForm" class="formRow" autocomplete="off">
      <input id="passInput" type="text" placeholder="Enter passphrase" />
      <button id="unlockBtn" type="submit">Unlock</button>
    </form>
    <div id="hint">Hint: it’s my last name.</div>
    <div id="error">That didn’t match. Try again.</div>
  </div>
</section>

<video id="firstVideo" muted playsinline preload="auto">
  <source src="first-video.mp4" type="video/mp4" />
</video>
<div id="blackout"></div>
<video id="bgVideo" muted playsinline preload="auto">
  <source src="bg-video.mp4" type="video/mp4" />
</video>

<section id="scene">
  <div id="scrollRig">
    <div id="scrollTop"></div>
    <div id="parchmentWrap">
      <div id="parchment"><div class="pad">
        <h2>Hey Ifrah,</h2>
        <p>The last time we met...</p>
        <!-- your full scroll text and media go here -->
      </div></div>
    </div>
    <div id="scrollBottom"></div>
  </div>
</section>

<script>
(function(){
  const intro=document.getElementById('intro');
  const startForm=document.getElementById('startForm');
  const passInput=document.getElementById('passInput');
  const err=document.getElementById('error');
  const firstVideo=document.getElementById('firstVideo');
  const bgVideo=document.getElementById('bgVideo');
  const blackout=document.getElementById('blackout');
  const rig=document.getElementById('scrollRig');
  const parchment=document.getElementById('parchment');
  const h2=parchment.querySelector('h2');
  const paras=parchment.querySelectorAll('p');

  function startExperience(){
    intro.style.opacity='0';
    setTimeout(()=>intro.classList.add('hidden'),800);
    firstVideo.play().then(()=>firstVideo.pause());
    bgVideo.play().then(()=>bgVideo.pause());
    firstVideo.currentTime=0;
    firstVideo.play().catch(()=>{});
    firstVideo.style.opacity='1';

    firstVideo.onended=()=>{
      blackout.style.opacity='1';
      setTimeout(()=>{
        firstVideo.style.opacity='0';
        firstVideo.pause();
        blackout.style.opacity='0';
        bgVideo.currentTime=0;
        bgVideo.play().catch(()=>{});
        bgVideo.style.opacity='1';
        setTimeout(triggerScroll,3000);
      },2000);
    };
  }

  function triggerScroll(){
    rig.classList.add('ready','unrolling');
    setTimeout(()=>{
      rig.classList.add('opened');
      parchment.style.opacity='1';
      parchment.style.height='var(--sheetH)';
      parchment.style.overflowY='auto';
      h2.style.animation='fadeIn 1.1s ease forwards';
      let delay=350;
      paras.forEach(p=>{
        p.style.animation=`fadeIn 1.1s ease forwards`;
        p.style.animationDelay=`${delay}ms`;
        delay+=250;
      });
    },2000);
  }

  startForm.addEventListener('submit',e=>{
    e.preventDefault();
    const val=(passInput.value||'').trim().toLowerCase();
    if(val==='malik'){
      err.style.opacity=0;
      const tapScreen=document.createElement("div");
      tapScreen.textContent="Tap to begin";
      Object.assign(tapScreen.style,{
        position:"fixed",inset:0,display:"flex",
        justifyContent:"center",alignItems:"center",
        background:"rgba(0,0,0,0.85)",color:"#fff",
        fontSize:"1.5rem",zIndex:999
      });
      document.body.appendChild(tapScreen);
      tapScreen.addEventListener("click",()=>{
        tapScreen.remove();
        startExperience();
      },{once:true});
    }
    else{
      err.style.opacity=1;
      startForm.classList.add('shake');
      setTimeout(()=>startForm.classList.remove('shake'),280);
    }
  });
})();
</script>
</body>
</html>
